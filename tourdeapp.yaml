exposedPort: 80
containers:
  - name: web
    image: registry.tourde.cloud/iudicesdivini/web
    port: 3001
    env:
      PORT: "3001"
  - name: server
    image: registry.tourde.cloud/iudicesdivini/server
    port: 8080
    env:
      DATABASE_URL: mysql://tda_user:strongPassword%3F@127.0.0.1:3306/buffet
      PORT: "8080"
  - name: mysql
    image: registry.tourde.cloud/iudicesdivini/mysql
    env:
      MYSQL_DATABASE: buffet
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: tda_user
      MYSQL_PASSWORD: strongPassword?
    port: 3306
  - name: caddy
    image: registry.tourde.cloud/iudicesdivini/caddy
    port: 80
build:
  - name: web
    context: ./frontend
    dockerfile: ./frontend/Dockerfile
    args:
      VITE_API_URL: "/api"
  - name: server
    context: ./backend
    dockerfile: ./backend/docker/Dockerfile
  - name: mysql
    context: ./backend/docker
    dockerfile: ./backend/docker/Dockerfile.mysql
  - name: caddy
    context: ./caddy
    dockerfile: ./caddy/Dockerfile
