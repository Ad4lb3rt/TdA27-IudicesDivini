# Local dev uses a bridge network with published ports (works on Docker Desktop
# for Mac/Windows, where network_mode: host has no effect). Tour de Cloud
# (tourdeapp.yaml) still shares one pod's localhost — Caddyfile and api.ts
# default to localhost:8080/3001 and only use service names when the
# BACKEND_UPSTREAM / FRONTEND_UPSTREAM / BACKEND_URL / DATABASE_URL envs below set them.
name: tda-app

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
    env_file: ./frontend/.env
    environment:
      BACKEND_URL: http://server:8080/api/v1
    ports:
      - "3001:3001"
    depends_on:
      - server

  server:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql://tda_user:strongPassword%3F@mysql:3306/product
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: buffet
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: tda_user
      MYSQL_PASSWORD: strongPassword?
      DEFAULT_AUTHENTICATION_PLUGIN: caching_sha2_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    environment:
      BACKEND_UPSTREAM: server:8080
      FRONTEND_UPSTREAM: web:3001
    ports:
      - "80:80"
    depends_on:
      - web
      - server

volumes:
  mysql-data:
